# Server variant (Oracle Cloud Always Free, ARM) with Cloudflare Tunnel.
# Loaded automatically via COMPOSE_FILE in .env:
#   COMPOSE_FILE=docker-compose.yml:deploy/oracle/docker-compose.oracle.yml
#
# - No port is reachable from the internet. The only way in is the tunnel (outgoing connection to
#   Cloudflare); in front of it sits Cloudflare Access with Google login.
# - Neo4j, Qdrant and backend internal only; the front end additionally on 127.0.0.1:8080 (for an SSH tunnel when testing).
# - Memory limits for the small Always Free machine (2 OCPU / 12 GB).

services:
  neo4j:
    ports: !reset []
    environment:
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-1G}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512M}

  qdrant:
    ports: !reset []

  backend:
    ports: !reset []

  frontend:
    ports: !override
      - "127.0.0.1:8080:80"

  # Cloudflare Tunnel: connects outward to Cloudflare, target in the dashboard: http://frontend:80
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN fehlt in .env (Cloudflare Zero Trust -> Networks -> Tunnels)}
    depends_on:
      - frontend
