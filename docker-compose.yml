# Komplettes Setup: Qdrant + Backend (FastAPI) + Frontend (nginx) + Ingestion/Tests als On-Demand-Jobs
#
#   docker compose up -d --build                                   # Stack starten -> http://localhost:8080
#                                                                  # (seed liest Projektordner aus RESEARCH_DIR automatisch ein)
#   docker compose run --rm ingest project /research/<Ordner>      # ein research project (neu) einlesen
#   docker compose run --rm -e OPENROUTER_API_KEY=sk-or-v1-… ingest all /research --force   # neu einlesen mit Key nur für diesen Lauf
#   docker compose run --rm ingest paper  /research/paper.pdf      # research paper einlesen
#   docker compose --profile test run --rm tests                   # Tests
#   docker compose run --rm migrate export                         # Index für einen Umzug nach ./migrate exportieren
#
# Server (Oracle Cloud + Cloudflare Tunnel/Access): siehe deploy/oracle/README.md
#
# Konfiguration über .env (Vorlage: .env.example).

name: research-rag

x-backend: &backend
  build:
    context: ./backend
    dockerfile: ../docker/backend.Dockerfile
    args:
      WITH_LIBREOFFICE: ${WITH_LIBREOFFICE:-true}
  image: research-rag-backend:latest
  env_file:
    - path: .env
      required: false
  environment:
    QDRANT_URL: http://qdrant:6333
    NEO4J_URL: bolt://neo4j:7687
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    DATA_DIR: /data
    GLOSSARY_PATH: /app/glossary/methods.yaml
    FRONTEND_DIR: /app/frontend
  volumes:
    - app_data:/data                                  # Uploads (ZIP-Projekte, Paper, Notes)
    - ./glossary:/app/glossary:ro                     # Methoden-Glossar, ohne Rebuild austauschbar
    - ./frontend:/app/frontend:ro                     # Backend liefert das Frontend auch selbst aus (Port 8000)
    - ./CHANGELOG.md:/app/CHANGELOG.md:ro             # Release notes für /api/release-notes
    - ./docs:/app/docs:ro                             # ISO 42001 / EU AI Act Doku und Technical Documentation (Ontologie)
    - ${RESEARCH_DIR:-./research}:/research:ro        # eigene Forschungsordner (read-only)
  depends_on:
    qdrant:
      condition: service_healthy
    neo4j:
      condition: service_healthy

services:
  # Wissensgraph für Graph RAG (Kachel B): DoCO/DEO-Ontologie, Design-Entscheidung ADR-001
  neo4j:
    image: neo4j:${NEO4J_VERSION:-5.26-community}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["n10s"]'                         # neosemantics: OWL/RDF-Ontologien (DoCO, DEO, FaBiO, CiTO) importieren
      NEO4J_dbms_unmanaged__extension__classes: n10s.endpoint=/rdf
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-1G}
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"                 # Neo4j Browser: http://localhost:7474
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12

  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.15.0}
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"                   # Dashboard: http://localhost:6333/dashboard
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    <<: *backend
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    expose: ["8000"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"                  # API direkt (Swagger: /docs)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Läuft bei jedem "up" einmal: liest neue Projektordner aus RESEARCH_DIR ein, bekannte werden übersprungen
  seed:
    <<: *backend
    restart: "no"
    entrypoint: ["python", "-m", "app.ingest"]
    command: ["all", "/research", "-v"]

  # Einmal-Job: docker compose run --rm ingest <project|paper|notes> <pfad> [--no-llm] [-v]
  ingest:
    <<: *backend
    profiles: ["ingest"]
    entrypoint: ["python", "-m", "app.ingest"]
    command: ["--help"]

  # Umzug auf einen Server: docker compose run --rm migrate export | import   (Ordner ./migrate)
  migrate:
    <<: *backend
    profiles: ["migrate"]
    volumes:
      - app_data:/data
      - ./migrate:/export
    entrypoint: ["python", "-m", "app.migrate"]
    command: ["--help"]

  tests:
    <<: *backend
    profiles: ["test"]
    depends_on: []
    entrypoint: ["pytest", "-q"]
    command: []

volumes:
  neo4j_data:
  neo4j_plugins:
  qdrant_data:
  app_data:
