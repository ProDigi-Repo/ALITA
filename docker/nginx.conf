server {
    listen 80;
    server_name _;

    # Docker-DNS bei jeder Anfrage neu auflösen (valid=10s): sonst zeigt nginx nach einem Neustart des Backends
    # weiter auf die alte Container-IP und antwortet mit 502 Bad Gateway.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_up http://backend:8000;

    root /usr/share/nginx/html;
    index index.html;

    # Projekt-ZIPs können groß sein
    client_max_body_size 1g;

    # Antworten werden gestreamt (Server-Sent Events): nicht puffern
    location ~ ^/api/(chat|graph)/stream$ {
        proxy_pass $backend_up;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass $backend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;      # LLM-Antworten können dauern
        proxy_request_buffering off;  # Uploads direkt durchreichen
    }

    location /files/ {
        proxy_pass $backend_up;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
