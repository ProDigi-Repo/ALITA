# Aggregate login limit per connector; invitation codes are high-entropy secrets.
limit_req_zone $binary_remote_addr zone=review_login:1m rate=10r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    # Cloudflare overwrites this header with the visitor's scheme. Never accept codes over HTTP.
    if ($http_x_forwarded_proto = http) { return 301 https://$host$request_uri; }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Existing UI uses inline handlers/styles; avoid a frontend rewrite in this deployment change.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Docker-DNS bei jeder Anfrage neu auflösen (valid=10s): sonst zeigt nginx nach einem Neustart des Backends
    # weiter auf die alte Container-IP und antwortet mit 502 Bad Gateway.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_up http://backend:8000;

    root /usr/share/nginx/html;
    index index.html;

    # Larger projects use the admin CLI, not the public upload endpoint.
    client_max_body_size 50m;

    # Antworten werden gestreamt (Server-Sent Events): nicht puffern
    location ~ ^/api/(chat|graph)/stream$ {
        proxy_pass $backend_up;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location = /api/reviewer/session {
        client_max_body_size 1k;
        limit_req zone=review_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $backend_up;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass $backend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;      # LLM-Antworten können dauern
        proxy_request_buffering off;  # Uploads direkt durchreichen
    }

    location /files/ {
        proxy_pass $backend_up;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
